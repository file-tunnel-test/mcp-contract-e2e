name: ore-mcp-config external consumer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ore-mcp-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ORE_MCP_RUST_LIBS_REV: 15d65e9428cdcd73cd5d6f1d12ab7242a28b3887
  FLAGS2ENV_REV: dada72e58fb976e95af43d1e35994ac33fe06f98

jobs:
  consumer:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        rust: [1.88.0, 1.97.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out test harness without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out immutable shared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: ${{ env.ORE_MCP_RUST_LIBS_REV }}
          path: vendor/mcp-rust-libs
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Verify immutable dependency state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/mcp-rust-libs rev-parse HEAD)" = "${ORE_MCP_RUST_LIBS_REV}"
          test -s config-consumer/Cargo.lock
          grep -Fq 'name = "ore-mcp-config"' config-consumer/Cargo.lock
          grep -Fq "git+https://github.com/ORESoftware/flags-2-env?rev=${FLAGS2ENV_REV}#${FLAGS2ENV_REV}" config-consumer/Cargo.lock
          cargo metadata --locked --manifest-path config-consumer/Cargo.toml --format-version 1 >/dev/null
          git diff --exit-code -- config-consumer/Cargo.lock

      - name: Verify formatting
        run: cargo fmt --manifest-path config-consumer/Cargo.toml --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path config-consumer/Cargo.toml --all-targets -- -D warnings

      - name: Run external configuration contract
        run: cargo test --locked --manifest-path config-consumer/Cargo.toml --all-targets

      - name: Verify dependency state remained unchanged
        run: git diff --exit-code -- config-consumer/Cargo.lock
