# Retry after proving that raw resolved values remain explicit while defaults
# are applied during typed coercion.
# Temporary, branch-scoped workflow. It generates and validates the external
# consumer lock, publishes only the formatted consumer/lock files, and is removed
# through the repository API before review.
name: reconcile DEN-3081 config consumer

on:
  push:
    branches:
      - agent/den-3081-ore-mcp-config-consumer
    paths:
      - .github/workflows/reconcile-den-3081-config-consumer.yml

permissions:
  contents: write

env:
  ORE_MCP_RUST_LIBS_REV: 15d65e9428cdcd73cd5d6f1d12ab7242a28b3887
  FLAGS2ENV_REV: dada72e58fb976e95af43d1e35994ac33fe06f98

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact consumer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-3081-ore-mcp-config-consumer
          persist-credentials: true
          show-progress: false

      - name: Check out immutable shared source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/mcp-rust-libs
          ref: ${{ env.ORE_MCP_RUST_LIBS_REV }}
          path: vendor/mcp-rust-libs
          persist-credentials: false
          show-progress: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - name: Generate and validate frozen external dependency state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/mcp-rust-libs rev-parse HEAD)" = "${ORE_MCP_RUST_LIBS_REV}"
          cargo generate-lockfile --manifest-path config-consumer/Cargo.toml
          cargo fmt --manifest-path config-consumer/Cargo.toml --all
          cargo fmt --manifest-path config-consumer/Cargo.toml --all -- --check
          grep -Fq 'name = "ore-mcp-config"' config-consumer/Cargo.lock
          grep -Fq "git+https://github.com/ORESoftware/flags-2-env?rev=${FLAGS2ENV_REV}#${FLAGS2ENV_REV}" config-consumer/Cargo.lock
          cargo metadata --locked --manifest-path config-consumer/Cargo.toml --format-version 1 >/dev/null
          cargo clippy --locked --manifest-path config-consumer/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path config-consumer/Cargo.toml --all-targets
          git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config-consumer
          git commit -m 'test(DEN-3081): commit frozen external config consumer'
          git push origin HEAD:agent/den-3081-ore-mcp-config-consumer
